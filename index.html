<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オンラインじゃんけん 6本勝負</title>
<style>
:root{--bg:#f3efe6;--ink:#1f2a37;--sub:#6b7280;--card:#fffdf8;--line:#d9d2c0;--me:#1d4ed8;--opp:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#141a22;--ink:#e8edf3;--sub:#93a0b0;--card:#1c2430;--line:#2e3a4a;--me:#7aa2ff;--opp:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:520px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.04em}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 20px;line-height:1.6}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.25em;text-align:center;margin:8px 0}
.hide{display:none!important}
.score{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.score .n{font-size:2.2rem;line-height:1.1}
.score .s2{text-align:right}
.me{color:var(--me)}.opp{color:var(--opp)}
.round{text-align:center;color:var(--sub);font-size:.9rem}
.pips{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.pip{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pip.w{background:var(--me)}.pip.l{background:var(--opp)}.pip.d{background:var(--sub)}
.status{text-align:center;font-weight:700;min-height:1.6em;margin-bottom:8px}

/* ---- 対戦ステージ(背景は常に明るい色。キャラ絵が暗い背景で見づらくならないように) ---- */
.stage{background:#f6f1e4;border:2px solid var(--line);border-radius:14px;padding:12px 10px 14px;margin-bottom:14px;color:#1f2a37}
.stage .status{color:#1f2a37}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{display:flex;flex-direction:column;align-items:center;min-width:0}
.tag{font-weight:800;font-size:.9rem;padding:2px 12px;border-radius:999px;color:#fff;margin-bottom:6px}
.tag.mine{background:#1d4ed8}.tag.theirs{background:#b91c1c}
.bubble{width:56px;height:56px;border-radius:50%;background:#fffdf8;border:2px solid #1f2a37;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:4px}
.fig{height:230px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:3px solid #d9d2c0;padding-bottom:2px}
.fig img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;margin-top:10px}
.pc{aspect-ratio:3/4;border-radius:8px;border:2px solid #1f2a37;background:#fffdf8;color:#1f2a37;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1;position:relative}
.pc .e{font-size:1.7rem}
.pc .t{font-size:.62rem;font-weight:700;margin-top:3px}
.mine-deck .pc{border-color:#1d4ed8}
.theirs-deck .pc{border-color:#b91c1c}
.pc.used{opacity:.22;filter:grayscale(1);border-style:dashed}
.pc.used::after{content:"";position:absolute;left:12%;right:12%;top:50%;border-top:2px solid #1f2a37;transform:rotate(-35deg)}
button.pc:not(:disabled){cursor:pointer}
button.pc:not(:disabled):hover{transform:translateY(-3px)}
button.pc:disabled:not(.used):not(.sel){opacity:.55;cursor:not-allowed}
.pc.sel{background:#1d4ed8;color:#fff;transform:translateY(-6px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.deckcap{font-size:.72rem;color:#6b7280;margin-top:6px;text-align:center}

table{width:100%;border-collapse:collapse;font-size:.95rem;text-align:center}
td,th{padding:6px 2px;border-bottom:1px solid var(--line)}
.final{font-size:2rem;font-weight:800;text-align:center;margin:6px 0 12px}
.err{color:var(--opp);font-size:.9rem;min-height:1.2em;text-align:center;line-height:1.5}
@media (max-width:380px){.fig{height:190px}.pc .e{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){.pc{transition:none!important}}
.pc{transition:transform .12s}
</style>
</head>
<body>
<main>
  <h1>じゃんけん6本勝負</h1>
  <p class="lead">ぐー・ちょき・ぱーを2枚ずつ使って6回戦。勝った回数が多いほうの勝ち。</p>

  <section id="lobby">
    <div class="card"><button class="btn" id="create" disabled>部屋を作る</button></div>
    <div class="card">
      <input id="codeIn" maxlength="5" placeholder="部屋コード" autocomplete="off">
      <button class="btn ghost" id="join" disabled>部屋に入る</button>
    </div>
    <div class="err" id="lobbyErr">準備中…</div>
  </section>

  <section id="wait" class="hide">
    <div class="card">
      <div class="round">このコードを相手に伝えてください(あなたはP1)</div>
      <div class="code" id="roomCode"></div>
      <div class="round">相手が入ると自動で始まります</div>
    </div>
  </section>

  <section id="game" class="hide">
    <div class="card">
      <div class="score">
        <div id="scoreL">P1<div class="n" id="sc1">0</div></div>
        <div class="round" id="roundLabel"></div>
        <div id="scoreR" class="s2">P2<div class="n" id="sc2">0</div></div>
      </div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="stage">
      <div class="status" id="status"></div>
      <div class="duel">
        <div class="side">

import { getDatabase, ref, get, set, remove, onValue, onDisconnect, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== ここをFirebaseコンソールの値に書き換える ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCS6P1CoPv4lorWzvUYX2Xr7t-NTa4ocN8",
  authDomain: "janken-ac758.firebaseapp.com",
  databaseURL: "https://janken-ac758-default-rtdb.firebaseio.com",
  projectId: "janken-ac758",
  appId: "1:31765072086:web:32d9e967d518e2b4256177"
};
/* ================================================== */

const HANDS = {rock:{e:'✊',n:'ぐー'}, scissors:{e:'✌️',n:'ちょき'}, paper:{e:'🖐️',n:'ぱー'}};
const BEATS = {rock:'scissors', scissors:'paper', paper:'rock'};
const TOTAL = 6, LIMIT = 2;
const $ = id => document.getElementById(id);
const show = id => ['lobby','wait','game','end'].forEach(s => $(s).classList.toggle('hide', s !== id));
const err = m => $('lobbyErr').textContent = m;

let db, uid, code, oppUid, S, finished = false, unsubs = [];
let role = null;            // 'P1' = 部屋を立てた人 / 'P2' = 参加した人
let mySide = 1, oppSide = 2; // 画面上の位置(1=左・P1、2=右・P2)
const R = path => ref(db, `rooms/${code}/${path}`);

async function sha(text){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
const rnd = () => [...crypto.getRandomValues(new Uint8Array(12))].map(x => x.toString(16).padStart(2,'0')).join('');

/* ---------- 初期化 ---------- */
(async () => {
  if (firebaseConfig.apiKey.startsWith('YOUR_')) return err('index.html の firebaseConfig を自分のFirebaseの値に書き換えてください');
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    uid = (await signInAnonymously(getAuth(app))).user.uid;
    $('create').disabled = $('join').disabled = false;
    err('');
  } catch (e) {
    err('Firebaseに接続できません: ' + (e.code || e.message) + '(Authenticationで「匿名」を有効にしましたか?)');
  }
})();

/* ---------- 部屋の作成・参加 ---------- */
$('create').onclick = async () => {
  err('');
  $('create').disabled = true;
  try {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (let i = 0; i < 5; i++){
      code = Array.from({length:5}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
      if (!(await get(R('host'))).exists()) break;
    }
    await set(R('host'), uid);
    await set(R(`online/${uid}`), true);
    onDisconnect(ref(db, `rooms/${code}`)).remove();   // ホストが落ちたら部屋ごと消える
    role = 'P1';
    $('roomCode').textContent = code;
    show('wait');
    // 相手の参加を待つ
    const off = onValue(R('guest'), snap => {
      if (snap.exists() && !S){ oppUid = snap.val(); off(); startGame(); }
    });
    unsubs.push(off);
  } catch (e) {
    err('部屋を作れませんでした: ' + (e.code || e.message) + '(Realtime Databaseのルールを確認してください)');
    $('create').disabled = false;
  }
};

$('join').onclick = async () => {
  err('');
  const c = $('codeIn').value.trim().toUpperCase();
  if (c.length !== 5) return err('5文字の部屋コードを入力してください');
  $('join').disabled = true;
  code = c;
  try {
    const host = await get(R('host'));
    if (!host.exists()){ code = null; $('join').disabled = false; return err('部屋が見つかりません(コードを確認してください)'); }
    await set(R(`online/${uid}`), true);
    const tx = await runTransaction(R('guest'), cur => cur === null ? uid : undefined);
    if (!tx.committed){
      await remove(R(`online/${uid}`));
      code = null; $('join').disabled = false;
      return err('その部屋はすでに埋まっています');
    }
    oppUid = host.val();
    role = 'P2';
    startGame();
  } catch (e) {
    err('参加できませんでした: ' + (e.code || e.message));
    $('join').disabled = false;
  }
};

/* ---------- ゲーム ---------- */
function startGame(){
  S = {round:0, used:{rock:0,scissors:0,paper:0}, oppUsed:{rock:0,scissors:0,paper:0}, mine:{}, oppCommit:{}, oppReveal:{}, revealed:{}, done:{}, locked:false, sel:null, sMe:0, sOpp:0, hist:[]};
  mySide = role === 'P1' ? 1 : 2;
  oppSide = 3 - mySide;
  // 名札・スコアの色(自分=青、相手=赤)
  $('tag'+mySide).textContent = `${role === 'P1' ? 'P1' : 'P2'} あなた`;
  $('tag'+mySide).className = 'tag mine';
  $('tag'+oppSide).textContent = `${role === 'P1' ? 'P2' : 'P1'} 相手`;
  $('tag'+oppSide).className = 'tag theirs';
  $('deck'+mySide).className = 'deck mine-deck';
  $('deck'+oppSide).className = 'deck theirs-deck';
  $('sc'+mySide).parentElement.className = (mySide === 1 ? '' : 's2 ') + 'me';
  $('sc'+oppSide).parentElement.className = (oppSide === 1 ? '' : 's2 ') + 'opp';
  $('scoreL').firstChild.textContent = mySide === 1 ? 'P1 あなた' : 'P1 相手';
  $('scoreR').firstChild.textContent = mySide === 2 ? 'P2 あなた' : 'P2 相手';
  $('deck'+mySide).onclick = e => { const b = e.target.closest('button[data-k]'); if (b) pick(b.dataset.k); };
  $('pips').innerHTML = Array.from({length:TOTAL}, () => '<div class="pip"></div>').join('');
  show('game');
  newRound();

  unsubs.push(onValue(R(`commits/${oppUid}`), s => { S.oppCommit = s.val() || {}; progress(); }));
  unsubs.push(onValue(R(`reveals/${oppUid}`), s => { S.oppReveal = s.val() || {}; progress(); }));
  // 相手の切断検知
  unsubs.push(onValue(R(`online/${oppUid}`), s => {
    if (!s.exists() && !finished){ finished = true; alert('相手との接続が切れました'); location.reload(); }
  }));
  onDisconnect(R(`online/${uid}`)).remove();
}

function setScores(){
  $('sc'+mySide).textContent = S.sMe;
  $('sc'+oppSide).textContent = S.sOpp;
}

function newRound(){
  S.locked = false; S.sel = null;
  $('bub'+mySide).textContent = '❔'; $('bub'+oppSide).textContent = '❔';
  $('status').textContent = '手を選んでください';
  renderCards();
  $('roundLabel').textContent = `第${S.round+1}回 / ${TOTAL}`;
  setScores();
}

// 6枚のカード(各手2枚)を描く。使用済みは薄く斜線。自分側だけクリックできる
function deckHtml(used, interactive){
  let h = '';
  for (let i = 0; i < LIMIT; i++){
    for (const k of Object.keys(HANDS)){
      const isUsed = i < used[k];
      const isSel = interactive && !isUsed && S.sel === k && i === used[k];
      const cls = 'pc' + (isUsed ? ' used' : '') + (isSel ? ' sel' : '');
      const inner = `<span class="e">${HANDS[k].e}</span><span class="t">${HANDS[k].n}</span>`;
      h += interactive
        ? `<button class="${cls}" data-k="${k}" ${isUsed || S.locked ? 'disabled' : ''}>${inner}</button>`
        : `<div class="${cls}">${inner}</div>`;
    }
  }
  return h;
}
function renderCards(){
  $('deck'+mySide).innerHTML = deckHtml(S.used, true);
  $('deck'+oppSide).innerHTML = deckHtml(S.oppUsed, false);
}

async function pick(k){
  if (S.locked || S.used[k] >= LIMIT) return;
  const r = S.round, n = rnd();
  S.locked = true; S.sel = k;
  S.mine[r] = {c:k, n};
  $('bub'+mySide).textContent = HANDS[k].e;
  $('status').textContent = '相手を待っています…';
  renderCards();
  // 先にハッシュだけ送る(後出し防止)。両者のハッシュが揃ってから中身を公開する
  await set(R(`commits/${uid}/${r}`), await sha(`${k}:${n}:${r}`));
  progress();
}

async function progress(){
  if (!S) return;
  const r = S.round;
  if (S.mine[r] && S.oppCommit[r] && !S.revealed[r]){
    S.revealed[r] = true;
    await set(R(`reveals/${uid}/${r}`), {c:S.mine[r].c, n:S.mine[r].n});
  }
  const o = S.oppReveal[r];
  if (S.mine[r] && o && !S.done[r]){
    S.done[r] = true;
    if (!HANDS[o.c] || await sha(`${o.c}:${o.n}:${r}`) !== S.oppCommit[r]){
      finished = true;
      alert('相手の不正を検知しました。対戦を終了します');
      return location.reload();
    }
    resolve(r, S.mine[r].c, o.c);
  }
}

function resolve(r, mc, oc){
  const res = mc === oc ? 'd' : (BEATS[mc] === oc ? 'w' : 'l');
  S.used[mc]++; S.oppUsed[oc]++; S.sel = null;
  if (res === 'w') S.sMe++;
  if (res === 'l') S.sOpp++;
  S.hist.push({mc, oc, res});
  $('bub'+oppSide).textContent = HANDS[oc].e;
  setScores();
  renderCards();
  document.querySelectorAll('.pip')[r].className = 'pip ' + res;
  $('status').textContent = {w:'勝ち!', l:'負け…', d:'あいこ'}[res];
  $('status').style.color = {w:'#1d4ed8', l:'#b91c1c', d:'#6b7280'}[res];
  setTimeout(() => {
    $('status').style.color = '';
    S.round++;
    if (S.round >= TOTAL) return finish();
    newRound(); progress();
  }, 2200);
}

function finish(){
  finished = true;
  const t = S.sMe > S.sOpp ? '🎉 あなたの勝ち!' : S.sMe < S.sOpp ? '😢 あなたの負け' : '🤝 引き分け';
  $('finalText').textContent = `${t}  ${S.sMe} - ${S.sOpp}`;
  $('hist').innerHTML = '<tr><th>回</th><th>あなた</th><th>相手</th><th>結果</th></tr>' +
    S.hist.map((h,i) => `<tr><td>${i+1}</td><td>${HANDS[h.mc].e}</td><td>${HANDS[h.oc].e}</td><td>${{w:'勝',l:'負',d:'分'}[h.res]}</td></tr>`).join('');
  show('end');
  unsubs.forEach(f => f());
  // 後片付け:自分の分を消す。ホストは少し待って部屋ごと削除
  remove(R(`commits/${uid}`)); remove(R(`reveals/${uid}`)); remove(R(`online/${uid}`));
  if (oppUid && S && role === 'P1') setTimeout(() => remove(ref(db, `rooms/${code}`)), 5000);
}
$('again').onclick = () => location.reload();
</script>
</body>
</html>
