<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オンラインじゃんけん 6本勝負</title>
<style>
:root{--bg:#f3efe6;--ink:#1f2a37;--sub:#6b7280;--card:#fffdf8;--line:#d9d2c0;--me:#1d4ed8;--opp:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#141a22;--ink:#e8edf3;--sub:#93a0b0;--card:#1c2430;--line:#2e3a4a;--me:#7aa2ff;--opp:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:480px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.04em}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 20px;line-height:1.6}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.25em;text-align:center;margin:8px 0}
.hide{display:none!important}
.score{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.score .n{font-size:2.2rem}
.me{color:var(--me)}.opp{color:var(--opp)}
.round{text-align:center;color:var(--sub);font-size:.9rem}
.pips{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.pip{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pip.w{background:var(--me)}.pip.l{background:var(--opp)}.pip.d{background:var(--sub)}
.arena{display:flex;justify-content:space-around;align-items:center;min-height:120px;font-size:4rem}
.arena small{display:block;font-size:.8rem;color:var(--sub);text-align:center}
.arena div{text-align:center}
.status{text-align:center;font-weight:700;min-height:1.6em}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hand{padding:14px 4px;border-radius:12px;border:2px solid var(--ink);background:var(--card);text-align:center}
.hand .e{font-size:2.6rem;display:block}
.hand .t{font-weight:700;font-size:.9rem}
.hand .r{font-size:.8rem;color:var(--sub)}
.hand:disabled{opacity:.35;cursor:not-allowed}
.hand.sel{background:var(--ink);color:var(--bg)}.hand.sel .r{color:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:.95rem;text-align:center}
td,th{padding:6px 2px;border-bottom:1px solid var(--line)}
.final{font-size:2rem;font-weight:800;text-align:center;margin:6px 0 12px}
.err{color:var(--opp);font-size:.9rem;min-height:1.2em;text-align:center;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>じゃんけん6本勝負</h1>
  <p class="lead">ぐー・ちょき・ぱーを2回ずつ使って6回戦。勝った回数が多いほうの勝ち。</p>

  <section id="lobby">
    <div class="card"><button class="btn" id="create" disabled>部屋を作る</button></div>
    <div class="card">
      <input id="codeIn" maxlength="5" placeholder="部屋コード" autocomplete="off">
      <button class="btn ghost" id="join" disabled>部屋に入る</button>
    </div>
    <div class="err" id="lobbyErr">準備中…</div>
  </section>

  <section id="wait" class="hide">
    <div class="card">
      <div class="round">このコードを相手に伝えてください</div>
      <div class="code" id="roomCode"></div>
      <div class="round">相手が入ると自動で始まります</div>
    </div>
  </section>

  <section id="game" class="hide">
    <div class="card">
      <div class="score">
        <div class="me">あなた<div class="n" id="sMe">0</div></div>
        <div class="round" id="roundLabel"></div>
        <div class="opp" style="text-align:right">相手<div class="n" id="sOpp">0</div></div>
      </div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="card">
      <div class="arena">
        <div><span id="aMe">❔</span><small>あなた</small></div>
        <div><span id="aOpp">❔</span><small>相手</small></div>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="hands" id="hands"></div>
  </section>

  <section id="end" class="hide">
    <div class="card">
      <div class="final" id="finalText"></div>
      <table id="hist"></table>
    </div>
    <button class="btn" id="again">ロビーに戻る</button>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, remove, onValue, onDisconnect, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== ここをFirebaseコンソールの値に書き換える ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCS6P1CoPv4lorWzvUYX2Xr7t-NTa4ocN8",
  authDomain: "janken-ac758.firebaseapp.com",
  databaseURL: "https://janken-ac758-default-rtdb.firebaseio.com",
  projectId: "janken-ac758",
  appId: "1:31765072086:web:32d9e967d518e2b4256177"
};
/* ================================================== */

const HANDS = {rock:{e:'✊',n:'ぐー'}, scissors:{e:'✌️',n:'ちょき'}, paper:{e:'🖐️',n:'ぱー'}};
const BEATS = {rock:'scissors', scissors:'paper', paper:'rock'};
const TOTAL = 6, LIMIT = 2;
const $ = id => document.getElementById(id);
const show = id => ['lobby','wait','game','end'].forEach(s => $(s).classList.toggle('hide', s !== id));
const err = m => $('lobbyErr').textContent = m;

let db, uid, code, oppUid, S, finished = false, unsubs = [];
const R = path => ref(db, `rooms/${code}/${path}`);

async function sha(text){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
const rnd = () => [...crypto.getRandomValues(new Uint8Array(12))].map(x => x.toString(16).padStart(2,'0')).join('');

/* ---------- 初期化 ---------- */
(async () => {
  if (firebaseConfig.apiKey.startsWith('YOUR_')) return err('index.html の firebaseConfig を自分のFirebaseの値に書き換えてください');
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    uid = (await signInAnonymously(getAuth(app))).user.uid;
    $('create').disabled = $('join').disabled = false;
    err('');
  } catch (e) {
    err('Firebaseに接続できません: ' + (e.code || e.message) + '(Authenticationで「匿名」を有効にしましたか?)');
  }
})();

/* ---------- 部屋の作成・参加 ---------- */
$('create').onclick = async () => {
  err('');
  $('create').disabled = true;
  try {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (let i = 0; i < 5; i++){
      code = Array.from({length:5}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
      if (!(await get(R('host'))).exists()) break;
    }
    await set(R('host'), uid);
    await set(R(`online/${uid}`), true);
    onDisconnect(ref(db, `rooms/${code}`)).remove();   // ホストが落ちたら部屋ごと消える
    $('roomCode').textContent = code;
    show('wait');
    // 相手の参加を待つ
    const off = onValue(R('guest'), snap => {
      if (snap.exists() && !S){ oppUid = snap.val(); off(); startGame(); }
    });
    unsubs.push(off);
  } catch (e) {
    err('部屋を作れませんでした: ' + (e.code || e.message) + '(Realtime Databaseのルールを確認してください)');
    $('create').disabled = false;
  }
};

$('join').onclick = async () => {
  err('');
  const c = $('codeIn').value.trim().toUpperCase();
  if (c.length !== 5) return err('5文字の部屋コードを入力してください');
  $('join').disabled = true;
  code = c;
  try {
    const host = await get(R('host'));
    if (!host.exists()){ code = null; $('join').disabled = false; return err('部屋が見つかりません(コードを確認してください)'); }
    await set(R(`online/${uid}`), true);
    const tx = await runTransaction(R('guest'), cur => cur === null ? uid : undefined);
    if (!tx.committed){
      await remove(R(`online/${uid}`));
      code = null; $('join').disabled = false;
      return err('その部屋はすでに埋まっています');
    }
    oppUid = host.val();
    startGame();
  } catch (e) {
    err('参加できませんでした: ' + (e.code || e.message));
    $('join').disabled = false;
  }
};

/* ---------- ゲーム ---------- */
function startGame(){
  S = {round:0, used:{rock:0,scissors:0,paper:0}, mine:{}, oppCommit:{}, oppReveal:{}, revealed:{}, done:{}, locked:false, sel:null, sMe:0, sOpp:0, hist:[]};
  $('hands').innerHTML = Object.keys(HANDS).map(k =>
    `<button class="hand" data-k="${k}"><span class="e">${HANDS[k].e}</span><span class="t">${HANDS[k].n}</span><span class="r"></span></button>`).join('');
  document.querySelectorAll('.hand').forEach(b => b.onclick = () => pick(b.dataset.k));
  $('pips').innerHTML = Array.from({length:TOTAL}, () => '<div class="pip"></div>').join('');
  show('game');
  newRound();

  unsubs.push(onValue(R(`commits/${oppUid}`), s => { S.oppCommit = s.val() || {}; progress(); }));
  unsubs.push(onValue(R(`reveals/${oppUid}`), s => { S.oppReveal = s.val() || {}; progress(); }));
  // 相手の切断検知
  unsubs.push(onValue(R(`online/${oppUid}`), s => {
    if (!s.exists() && !finished){ finished = true; alert('相手との接続が切れました'); location.reload(); }
  }));
  onDisconnect(R(`online/${uid}`)).remove();
}

function newRound(){
  S.locked = false; S.sel = null;
  $('aMe').textContent = '❔'; $('aOpp').textContent = '❔';
  $('status').textContent = '手を選んでください';
  renderHands();
  $('roundLabel').textContent = `第${S.round+1}回 / ${TOTAL}`;
  $('sMe').textContent = S.sMe; $('sOpp').textContent = S.sOpp;
}

function renderHands(){
  document.querySelectorAll('.hand').forEach(b => {
    const k = b.dataset.k, left = LIMIT - S.used[k];
    b.querySelector('.r').textContent = `あと${left}回`;
    b.disabled = S.locked || left <= 0;
    b.classList.toggle('sel', S.sel === k);
  });
}

async function pick(k){
  if (S.locked || S.used[k] >= LIMIT) return;
  const r = S.round, n = rnd();
  S.locked = true; S.sel = k;
  S.mine[r] = {c:k, n};
  $('aMe').textContent = HANDS[k].e;
  $('status').textContent = '相手を待っています…';
  renderHands();
  // 先にハッシュだけ送る(後出し防止)。両者のハッシュが揃ってから中身を公開する
  await set(R(`commits/${uid}/${r}`), await sha(`${k}:${n}:${r}`));
  progress();
}

async function progress(){
  if (!S) return;
  const r = S.round;
  if (S.mine[r] && S.oppCommit[r] && !S.revealed[r]){
    S.revealed[r] = true;
    await set(R(`reveals/${uid}/${r}`), {c:S.mine[r].c, n:S.mine[r].n});
  }
  const o = S.oppReveal[r];
  if (S.mine[r] && o && !S.done[r]){
    S.done[r] = true;
    if (!HANDS[o.c] || await sha(`${o.c}:${o.n}:${r}`) !== S.oppCommit[r]){
      finished = true;
      alert('相手の不正を検知しました。対戦を終了します');
      return location.reload();
    }
    resolve(r, S.mine[r].c, o.c);
  }
}

function resolve(r, mc, oc){
  const res = mc === oc ? 'd' : (BEATS[mc] === oc ? 'w' : 'l');
  S.used[mc]++;
  if (res === 'w') S.sMe++;
  if (res === 'l') S.sOpp++;
  S.hist.push({mc, oc, res});
  $('aOpp').textContent = HANDS[oc].e;
  $('sMe').textContent = S.sMe; $('sOpp').textContent = S.sOpp;
  document.querySelectorAll('.pip')[r].className = 'pip ' + res;
  $('status').textContent = {w:'勝ち!', l:'負け…', d:'あいこ'}[res];
  $('status').style.color = {w:'var(--me)', l:'var(--opp)', d:'var(--sub)'}[res];
  setTimeout(() => {
    $('status').style.color = '';
    S.round++;
    if (S.round >= TOTAL) return finish();
    newRound(); progress();
  }, 2200);
}

function finish(){
  finished = true;
  const t = S.sMe > S.sOpp ? '🎉 あなたの勝ち!' : S.sMe < S.sOpp ? '😢 あなたの負け' : '🤝 引き分け';
  $('finalText').textContent = `${t}  ${S.sMe} - ${S.sOpp}`;
  $('hist').innerHTML = '<tr><th>回</th><th>あなた</th><th>相手</th><th>結果</th></tr>' +
    S.hist.map((h,i) => `<tr><td>${i+1}</td><td>${HANDS[h.mc].e}</td><td>${HANDS[h.oc].e}</td><td>${{w:'勝',l:'負',d:'分'}[h.res]}</td></tr>`).join('');
  show('end');
  unsubs.forEach(f => f());
  // 後片付け:自分の分を消す。ホストは少し待って部屋ごと削除
  remove(R(`commits/${uid}`)); remove(R(`reveals/${uid}`)); remove(R(`online/${uid}`));
  if (oppUid && S && document.getElementById('roomCode').textContent === code) setTimeout(() => remove(ref(db, `rooms/${code}`)), 5000);
}
$('again').onclick = () => location.reload();
</script>
</body>
</html>
